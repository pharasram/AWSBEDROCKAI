bundle:
  name: insurance-rag
  databricks_cli_version: ">= 1.17.0, < 2.0.0"

include:
  - resources/*.yml

variables:
  catalog:
    description: Existing Unity Catalog catalog
  schema:
    description: Isolated target schema owned by this deployment
  landing_path:
    description: Approved append-only JSON landing prefix in S3 or a UC volume
  cluster_id:
    description: Existing embedding cluster with Bedrock instance profile and vector DB access
  secret_scope:
    description: Existing restricted Databricks secret scope
  vector_secret_key:
    description: Key holding the pgvector TLS DSN
  deployer_sp:
    description: Production service principal application ID
    default: unused-in-dev

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

artifacts:
  default:
    type: whl
    build: python -m pip wheel --no-deps . -w dist
    path: .

sync:
  exclude:
    - tests/**
    - data/**
    - terraform/**
    - cloud/**
    - docs/**
    - '*.zip'

# Supply catalog/schema/landing_path/cluster/secrets through BUNDLE_VAR_* or
# .databricks/bundle/<target>/variable-overrides.json (ignored by Git).
# Separate catalog/schema and landing prefixes are required for dev and prod.
targets:
  dev:
    default: true
    mode: development
    resources:
      pipelines:
        insurance_pipeline:
          development: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.deployer_sp}
    permissions:
      - service_principal_name: ${var.deployer_sp}
        level: CAN_MANAGE
    resources:
      pipelines:
        insurance_pipeline:
          development: false
