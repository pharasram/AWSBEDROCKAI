name: Validate declarative pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  declarative:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: databricks/setup-cli@main
        with:
          version: '1.17.0'
      - run: pip install 'pyspark==4.0.1' 'pyyaml>=6,<7' 'jsonschema>=4,<5' regex
      - run: databricks bundle schema > /tmp/bundle-schema.json
      - run: python scripts/check_bundle.py /tmp/bundle-schema.json
      - run: python -m compileall -q pipelines scripts notebooks
      - run: python tests/spark_checks.py
