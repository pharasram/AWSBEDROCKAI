name: Import tested source bundle
on:
  push:
    paths: [insurance-rag-source.zip]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack approved source
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile
          p = pathlib.Path('insurance-rag-source.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '76dc94bf2194a2a73be19c6b6b3c252ff8ab2fb68e20ac215b1753645084bc71'
          with zipfile.ZipFile(p) as z:
              for name in z.namelist():
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  if path.parts[0] not in {'.git', '.github'}:
                      z.extract(name, '.')
          PY
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src cloud notebooks
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
      - name: Commit verified product source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .gitignore pyproject.toml databricks.yml src cloud data docs notebooks sql terraform tests
          git diff --cached --quiet || git commit -m 'Build insurance RAG product with tested local pipeline and cloud assets'
          git push origin HEAD:main
