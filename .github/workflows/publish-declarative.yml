name: Publish declarative update
on:
  push:
    paths: [declarative-update.zip]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: databricks/setup-cli@main
        with:
          version: '1.17.0'
      - name: Verify and extract authored source
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile
          p = pathlib.Path('declarative-update.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '8eb3b10f832f4bc29addbeb15da8e2166a654364eb75468d217c34d0c84fc116'
          with zipfile.ZipFile(p) as z:
              for name in z.namelist():
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  if path.parts[0] not in {'.git', '.github'}:
                      z.extract(name, '.')
          PY
      - run: pip install . 'pyspark==4.0.1' 'pyyaml>=6,<7' 'jsonschema>=4,<5' regex
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src cloud notebooks pipelines scripts
      - run: databricks bundle schema > /tmp/bundle-schema.json
      - run: python scripts/check_bundle.py /tmp/bundle-schema.json
      - run: python tests/spark_checks.py
      - name: Commit validated declarative product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md databricks.yml resources pipelines config scripts notebooks src sql docs tests
          git diff --cached --quiet || git commit -m 'Build bundle-managed declarative insurance pipeline and detailed architecture guide'
          git push origin HEAD:main
